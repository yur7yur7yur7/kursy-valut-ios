name: Build iOS (unsigned .ipa)

# Собирает приложение и виджет без подписи и упаковывает в .ipa.
# Готовый файл ставится на iPhone через Sideloadly (нужен только Apple ID).
#
# Один и тот же файл работает в двух местах:
#   * в монорепозитории исходники лежат в ios/  -> скрипт заходит в ios/;
#   * в публичном зеркале kursy-valut-ios исходники в корне -> скрипт остаётся в корне.
# Поэтому путь до каталога с project.yml определяется на лету.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "ios-v*"

permissions:
  contents: write

# новый пуш отменяет предыдущий прогон: в очереди не копятся дубли
concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    # несколько меток — GitHub возьмёт любой доступный образ macOS
    runs-on: [macos-latest, macos-15, macos-13]
    steps:
      - name: Исходники
        uses: actions/checkout@v5

      - name: Найти каталог iOS
        id: ios
        run: |
          if [ -d "ios/project.yml" ]; then
            echo "dir=ios" >> "$GITHUB_OUTPUT"
            echo "artifact=ios/RatesApp-unsigned.ipa" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "artifact=RatesApp-unsigned.ipa" >> "$GITHUB_OUTPUT"
          fi
          echo "каталог исходников: ${{ steps.ios.outputs.dir }}"

      - name: XcodeGen
        run: |
          set -e
          cd "${{ steps.ios.outputs.dir }}"
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Сборка
        run: |
          set -o pipefail
          cd "${{ steps.ios.outputs.dir }}"
          # имя схемы берём из проекта: так сборка не сломается из-за переименования
          SCHEME=$(xcodebuild -project RatesApp.xcodeproj -list \
                   | sed -n '/Schemes:/,$p' \
                   | sed -n 's/^ *\([A-Za-z0-9_.-]*\)$/\1/p' | head -1)
          SCHEME=${SCHEME:-RatesApp}
          echo "Схема сборки: $SCHEME"
          xcodebuild \
            -project RatesApp.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Упаковка в .ipa
        run: |
          set -e
          cd "${{ steps.ios.outputs.dir }}"
          APP="build/Build/Products/Release-iphoneos/RatesApp.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # виджет должен лежать внутри приложения
          test -d "Payload/RatesApp.app/PlugIns/RatesWidget.appex" || echo "виджет не встроен"
          zip -qry RatesApp-unsigned.ipa Payload
          ls -la RatesApp-unsigned.ipa

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: RatesApp-unsigned-ipa
          path: ${{ steps.ios.outputs.artifact }}

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${{ steps.ios.outputs.dir }}"
          gh release create "${GITHUB_REF_NAME}" RatesApp-unsigned.ipa \
            --title "Курсы валют для iPhone ${GITHUB_REF_NAME#ios-v}" \
            --notes "Неподписанная сборка для Sideloadly: скачайте .ipa и поставьте через Sideloadly на iPhone. Подпись Apple ID живёт 7 дней, потом нужно переподписать." || true
