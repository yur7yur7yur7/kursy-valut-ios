name: Проверка синтаксиса Swift

# Компилятор Swift есть на Linux-раннере: `swiftc -parse` проверяет синтаксис
# всех файлов, не требуя iOS SDK. Полная сборка — в workflow сборки .ipa.
#
# Файл работает и в монорепозитории (исходники в ios/), и в публичном зеркале
# kursy-valut-ios (исходники в корне).

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'Sources/**'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Исходники
        uses: actions/checkout@v5

      - name: Найти каталог iOS
        id: ios
        run: |
          if [ -d "ios/Sources" ]; then
            echo "dir=ios" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi
          echo "каталог исходников: ${{ steps.ios.outputs.dir }}"

      - name: Версия Swift
        run: swift --version

      - name: Разбор синтаксиса
        run: |
          set -e
          cd "${{ steps.ios.outputs.dir }}"
          files=$(find Sources -name '*.swift' | sort)
          count=$(echo "$files" | grep -c . )
          echo "Проверяем файлов: $count"
          fail=0
          for f in $files; do
            if ! swiftc -parse "$f"; then
              echo "::error file=$f::ошибка разбора"
              fail=1
            fi
          done
          if [ "$fail" != "0" ]; then
            exit 1
          fi
          echo "Синтаксис в порядке: $count файлов"
