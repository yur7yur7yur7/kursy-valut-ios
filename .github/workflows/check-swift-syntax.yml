name: Проверка синтаксиса Swift

# Компилятор Swift есть на Linux-раннере: `swiftc -parse` проверяет синтаксис
# всех файлов, не требуя iOS SDK. Полная сборка — в workflow сборки .ipa.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Версия Swift
        run: swift --version

      - name: Разбор синтаксиса
        run: |
          set -e
          fail=0
          for f in $(find Sources -name '*.swift' | sort); do
            if ! swiftc -parse "$f"; then
              echo "::error file=$f::ошибка разбора"
              fail=1
            fi
          done
          if [ "$fail" != "0" ]; then
            exit 1
          fi
          echo "Синтаксис в порядке"
